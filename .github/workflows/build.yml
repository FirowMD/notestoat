name: Build NoteStoat

on: [push, pull_request]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: vx.x

      - name: Install dependencies
        run: deno install

      - name: Resolve release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$') {
            throw "Release tags must use semantic versioning (for example, v0.4.2). Got: $env:RELEASE_TAG"
          }

          "RELEASE_VERSION=$($Matches.version)" >> $env:GITHUB_ENV

      - name: Build NoteStoat
        shell: pwsh
        run: |
          $tauriArgs = @('task', 'tauri', 'build', '--ci')

          if ($env:RELEASE_VERSION) {
            $versionConfigPath = Join-Path $env:RUNNER_TEMP 'release-version.json'
            @{ version = $env:RELEASE_VERSION } |
              ConvertTo-Json |
              Set-Content -Path $versionConfigPath
            $tauriArgs += @('--config', $versionConfigPath)
          }

          & deno @tauriArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload build artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/release/bundle/nsis/NoteStoat_${{ env.RELEASE_VERSION }}_*-setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
